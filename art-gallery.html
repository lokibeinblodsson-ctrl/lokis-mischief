<style>
  :root { --gold:#f59e0b; --dark:#07070a; --panel:#0e1117; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--dark); color:#e8e2d4; font-family:Inter,system-ui,sans-serif; }
  header { padding:28px 20px 14px; text-align:center; border-bottom:1px solid #1c2430; }
  header h1 { font-family:Cinzel,serif; color:var(--gold); margin:0 0 6px; letter-spacing:1px; }
  header p { color:#9aa4ad; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .deity { background:var(--panel); border:1px solid #1c2430; border-radius:14px; padding:18px; margin:18px 0; }
  .deity h3 { font-family:Cinzel,serif; color:var(--gold); margin:0 0 12px; text-transform:capitalize; }
  .thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .thumbs figure { margin:0; background:#000; border-radius:8px; overflow:hidden; }
  .thumbs img { width:100%; height:auto; display:block; }
  .thumbs figcaption { font-size:11px; color:#7d8893; padding:4px 6px; text-align:center; word-break:break-all; }
  a.back { color:var(--gold); text-decoration:none; display:inline-block; margin:0 20px 10px; }
  @media(max-width:640px){ .thumbs { grid-template-columns:repeat(2,1fr); } }
