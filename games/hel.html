<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hel — Soul Sorting | Loki's Mischief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games/engine.css">
<style>#game{position:fixed;inset:0;z-index:1}</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Wave <b id="wave">1</b>/10</span><span>Souls/min <b id="spm">0</b></span><span>Acc <b id="acc">100</b>%</span></div>
<div class="hel-tip" id="tip">⚖️ HEL — <b style="color:#7dd3e0">A / ← / swipe left = AUTOMATE</b> · <b style="color:#d4b778">D / → / swipe right = KEEP HUMAN</b></div>
<div id="game"></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'hel', deity:'hel',
  lesson:'You built the boundary first — route every lead before the pile forms. Get Odin\'s Decision OS triage workflow.',
  mount(){ buildIntro(); }, onResize(w,h){ if(cv){cv.width=w;cv.height=h;} } };
Engine._game=G;

const C=Engine.C;
let cv,cx,w,h,state='idle';
let souls=[], wave=1, solved=0, correct=0, total=0, waveStart=0, essAuto=0, essHuman=0, timerBase=5;
const LABELS=[
  ['VIP','refund'],['Cold','lead'],['Invoice','$5k'],['Angry','tweet'],['Demo','no-show'],
  ['Upsell','ready'],['Charge','back'],['New','signup'],['Support','ticket'],['Renewal','due'],['Bug','report'],['Referral','in']
];
// a soul should be KEEP HUMAN if it needs a person (VIP, Referral, New, Upsell, Angry, Charge, Bug, Support) else AUTOMATE
function shouldHuman(l){ return ['VIP','Referral','New','Upsell','Angry','Charge','Bug','Support','Demo'].includes(l[0]); }

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>⚖️ Hel — Soul Sorting</h1>
    <p>Souls drift toward Hel's gate. Sort fast: <b style="color:#7dd3e0">A / ← / swipe left = AUTOMATE</b> the routine ones, <b style="color:#d4b778">D / → / swipe right = KEEP HUMAN</b> the ones needing a soul.</p>
    <p style="color:var(--muted);font-size:12px">A 5-second ring ticks each soul. Wrong call costs essence. 10 waves of 8. Fast + accurate = a high souls/min.</p>
    <div class="lesson">✦ Best converter: this is your agency's triage in 60 seconds.</div>
    <div class="row"><button class="btn" id="startBtn">Open the Gate →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.className='game';
  cv.width=innerWidth; cv.height=innerHeight; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.fitCanvas(cv); w=cv.width; h=cv.height;
  cv.addEventListener('pointerdown',onDown);
  addEventListener('keydown',onKey);
  state='playing';
  Engine.setState('playing'); Engine.startLoop(frame);
  wave=1; solved=0; correct=0; total=0; essAuto=0; essHuman=0; timerBase=5; waveStart=performance.now();
  document.getElementById('wave').textContent=1; spawnWave();
}
function spawnWave(){
  souls=[]; solved=0;
  for(let i=0;i<8;i++) setTimeout(()=>{ if(state==='playing') spawnSoul(); }, i*430);
  waveStart=performance.now();
}
function spawnSoul(){
  const lab=LABELS[Math.floor(Math.random()*LABELS.length)];
  const x=w/2 + (Math.random()*2-1)*(w*0.30);
  souls.push({lab, x, y:-40, decided:false, dead:false, t0:performance.now(), life:timerBase*1000});
}
function onDown(e){
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  for(const s of souls){ if(s.decided||s.dead) continue;
    if((x-s.x)**2+(y-s.y)**2 < 60*60){ decide(s, x < w/2 ? 'auto':'human'); return; } }
}
function onKey(e){
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft'){ pickSide('auto'); }
  else if(e.key==='d'||e.key==='D'||e.key==='ArrowRight'){ pickSide('human'); }
}
function pickSide(side){
  // decide the lowest (closest to gate) undecided soul
  let best=null; for(const s of souls){ if(!s.decided&&!s.dead){ if(!best||s.y>best.y) best=s; } }
  if(best) decide(best, side);
}
function decide(s,side){
  s.decided=true; total++;
  const ok=(side==='human')===shouldHuman(s.lab);
  if(ok){ correct++; if(side==='auto')essAuto+=10; else essHuman+=10; Engine.blip(ok?660:200,.09,'sine',.18); }
  else { if(side==='auto')essAuto-=10; else essHuman-=10; Engine.blip(150,.12,'sawtooth',.16); }
  s.dead=true; s.fly=side;
  solved++;
  if(solved>=8){ wave++; if(wave>10){ return end(); } document.getElementById('wave').textContent=wave;
    timerBase=Math.max(2,timerBase-0.3); setTimeout(spawnWave,400); }
}
function frame(dt){
  if(state!=='playing') return;
  cx.clearRect(0,0,w,h);
  // Hel half-alive/half-corpse at top center
  drawHel();
  // gate line
  const gateY=h*0.62;
  cx.strokeStyle='rgba(125,211,224,.25)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(0,gateY); cx.lineTo(w,gateY); cx.stroke();
  // piles
  drawPile(0.25*w, '#7dd3e0', 'AUTOMATE', essAuto);
  drawPile(0.75*w, '#d4b778', 'KEEP HUMAN', essHuman);
  // souls
  for(const s of souls){
    if(s.decided){
      const tx=s.fly==='auto'?0.25*w:0.75*w; s.x+=(tx-s.x)*Math.min(1,dt*8); s.y+=(h*0.9-s.y)*Math.min(1,dt*6);
      if(Math.abs(s.y-h*0.9)<6){ s.done=true; }
    } else { s.y += (gateY - s.y)*Math.min(1,dt*0.3) + dt*40; }
    const tleft=1-(performance.now()-s.t0)/s.life;
    if(!s.decided && tleft<=0){ // timeout = miss
      total++; s.decided=true; s.dead=true; s.fly=shouldHuman(s.lab)?'human':'auto';
      if(s.fly==='auto')essAuto-=10; else essHuman-=10; solved++;
      if(solved>=8){ wave++; if(wave>10){return end();} document.getElementById('wave').textContent=wave; timerBase=Math.max(2,timerBase-0.3); setTimeout(spawnWave,400);} }
    drawSoul(s,tleft);
  }
  souls=souls.filter(s=>!(s.done&&s.decided)|| !s.decided);
  // hud
  const mins=(performance.now()-waveStart)/60000;
  document.getElementById('spm').textContent= Math.round(solved/Math.max(mins,0.016));
  document.getElementById('acc').textContent= total?Math.round(correct/total*100):100;
}
function drawHel(){
  const cx0=w/2, cy0=h*0.16;
  // body
  cx.fillStyle='#1a2433'; cx.beginPath(); cx.ellipse(cx0,cy0,34,46,0,0,7); cx.fill();
  // two halves: left alive (blue), right corpse (grey)
  cx.fillStyle='rgba(125,211,224,.5)'; cx.beginPath(); cx.ellipse(cx0-12,cy0-6,10,8,0,0,7); cx.fill();
  cx.fillStyle='#64748b'; cx.fillRect(cx0+4,cy0-14,16,20);
  // crown
  cx.fillStyle=C.gold; cx.beginPath(); cx.moveTo(cx0-20,cy0-40); cx.lineTo(cx0,cy0-52); cx.lineTo(cx0+20,cy0-40); cx.lineTo(cx0+12,cy0-44); cx.lineTo(cx0-12,cy0-44); cx.closePath(); cx.fill();
}
function drawSoul(s,tleft){
  const col = shouldHuman(s.lab)?C.gold:C.ice;
  cx.save(); cx.translate(s.x,s.y);
  cx.fillStyle='rgba(125,211,224,.18)'; cx.beginPath(); cx.arc(0,0,28,0,7); cx.fill();
  cx.fillStyle=col; cx.font='600 13px Inter'; cx.textAlign='center';
  cx.fillText(s.lab[0],0,-4); cx.fillText(s.lab[1],0,12);
  // timer ring
  cx.strokeStyle = tleft<0.25?'#ef4444':C.ice; cx.lineWidth=3;
  cx.beginPath(); cx.arc(0,0,34,-Math.PI/2, -Math.PI/2 + Math.max(0,tleft)*2*Math.PI); cx.stroke();
  cx.restore();
}
function drawPile(px,col,label,ess){
  const py=h*0.9;
  cx.fillStyle=col; cx.globalAlpha=0.12; cx.beginPath(); cx.ellipse(px,py,70,46,0,0,7); cx.fill(); cx.globalAlpha=1;
  cx.strokeStyle=col; cx.lineWidth=2; cx.beginPath(); cx.ellipse(px,py,70,46,0,0,7); cx.stroke();
  cx.fillStyle=col; cx.font='700 13px Cinzel'; cx.textAlign='center'; cx.fillText(label,px,py-54);
  cx.fillStyle='#cbd5e1'; cx.font='600 12px Inter'; cx.fillText((ess>0?ess:0)+' essence',px,py+4);
}
function end(){
  state='lose'; Engine.startLoop(()=>{});
  cv.removeEventListener('pointerdown',onDown); removeEventListener('keydown',onKey);
  const spm=Math.round(solved/((performance.now()-waveStart)/60000)||1);
  Engine.showEnd({ title:'⚖️ The Gate Holds', score:solved, sub:`${spm} souls/min · ${total?Math.round(correct/total*100):100}% acc`, lesson:G.lesson, deity:G.deity, shareCard:null });
}
G.mount();
</script>
</body></html>
