<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jormungandr — Serpent Memory | Loki's Mischief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games/engine.css">
<style>#game{position:fixed;inset:0;z-index:1}</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Round <b id="round">1</b></span><span>Streak <b id="streak">0</b></span><span>Lives <b id="lives">3</b></span></div>
<div id="game"></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'jormungandr', deity:'jormungandr',
  lesson:'You broke the loop by remembering the route. Jormungandr\'s integration workflow connects every node without circling back.',
  mount(){ buildIntro(); }, onResize(w,h){ if(cv){cv.width=w;cv.height=h; layout();} } };
Engine._game=G;
const C=Engine.C;
let cv,cx,w,h,state='idle';
const RUNES=[{g:'ᚠ',n:'Fehu'},{g:'ᚢ',n:'Uruz'},{g:'ᚦ',n:'Thurisaz'},{g:'ᚨ',n:'Ansuz'}];
let seq=[],input=[],round=1,streak=0,lives=3,phase='idle',nodes=[],playing=false,showIdx=0,showTimer=0;

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>🐍 Jormungandr — Serpent Memory</h1>
    <p>The World-Serpent coils into the board. Watch the rune nodes light in sequence, then tap them in the same order. One wrong tap and the loop closes.</p>
    <p style="color:var(--muted);font-size:12px">Starts at length 3, grows to 12. Speed +5% per round. Three lives.</p>
    <div class="lesson">✦ Models integration / routing loops — remember the route, don't circle back.</div>
    <div class="row"><button class="btn" id="startBtn">Uncoil →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.className='game';
  cv.width=innerWidth; cv.height=innerHeight; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.fitCanvas(cv); w=cv.width; h=cv.height; layout();
  cv.addEventListener('pointerdown',onDown);
  state='playing'; Engine.setState('playing'); Engine.startLoop(frame);
  round=1; streak=0; lives=3; phase='show'; seq=[]; input=[]; playing=true; showIdx=0;
  // start at length 3
  for(let i=0;i<3;i++) seq.push(Math.floor(Math.random()*4));
  document.getElementById('lives').textContent=3; document.getElementById('round').textContent=1;
  nextRound();
}
function layout(){
  nodes=[]; const cx0=w/2, cy0=h/2, R=Math.min(w,h)*0.33;
  for(let i=0;i<4;i++){ const a=-Math.PI/2 + i*Math.PI/2; nodes.push({x:cx0+R*Math.cos(a),y:cy0+R*Math.sin(a),r:Math.max(46,R*0.16),i}); }
}
function nextRound(){
  input=[]; phase='show'; showIdx=0; showTimer=0;
}
function flash(i){ nodes[i].lit=1; Engine.blip(280+i*140,.18,'sine',.2); }
function onDown(e){
  if(phase!=='input'||!playing) return;
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  // nearest node within generous radius
  let best=null,bd=1e9;
  for(const n of nodes){ const d=(x-n.x)**2+(y-n.y)**2; if(d<bd){bd=d;best=n;} }
  if(best && bd < (best.r+40)**2) onNode(best.i);
}
function onNode(i){
  flash(i); input.push(i);
  if(input[input.length-1]!==seq[input.length-1]){
    lives--; document.getElementById('lives').textContent=lives; Engine.blip(140,.2,'sawtooth',.2);
    if(lives<=0){ return end(); }
    input=[]; phase='show'; showIdx=0; showTimer=0; return;
  }
  if(input.length===seq.length){
    streak++; document.getElementById('streak').textContent=streak; round++;
    document.getElementById('round').textContent=round; Engine.setBest('jormungandr',streak);
    seq.push(Math.floor(Math.random()*4)); // grow
    phase='show'; showIdx=0; showTimer=0.4;
  }
}
function frame(dt){
  if(state!=='playing') return;
  // show phase: step through sequence
  if(phase==='show'){
    showTimer+=dt;
    const speed=Math.max(0.5,1.1-(round-1)*0.05);
    if(showTimer>=speed){
      showTimer=0;
      if(showIdx<seq.length){ flash(seq[showIdx]); showIdx++; }
      if(showIdx>=seq.length){ phase='input'; }
    }
  }
  const W=w,H=h; cx.clearRect(0,0,W,H);
  // coiled serpent ring (thick, scaly)
  const cx0=W/2, cy0=H/2, R=Math.min(W,H)*0.33;
  for(let k=0;k<3;k++){ cx.strokeStyle=`rgba(46,${120+k*20},${90+k*10},${0.5-k*0.12})`; cx.lineWidth=16-k*4;
    cx.beginPath(); cx.arc(cx0,cy0,R-(k*7),0,7); cx.stroke(); }
  // serpent head marker
  cx.fillStyle='#2a7a55'; cx.beginPath(); cx.arc(cx0+R,cy0,12,0,7); cx.fill();
  // nodes
  nodes.forEach(n=>{
    const glow=n.lit||0;
    cx.fillStyle=glow?`rgba(125,211,224,${0.3+glow*0.5})`:'#111a26';
    cx.beginPath(); cx.arc(n.x,n.y,n.r,0,7); cx.fill();
    cx.strokeStyle=glow?'#7dd3e0':'#1e2e45'; cx.lineWidth=3; cx.stroke();
    cx.fillStyle=glow?'#04121a':C.gold; cx.font=`${Math.round(n.r*0.7)}px serif`; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(RUNES[n.i].g,n.x,n.y);
    n.lit=Math.max(0,(n.lit||0)-dt*1.5);
  });
  cx.fillStyle='#64748b'; cx.font='600 14px Cinzel'; cx.textAlign='center';
  cx.fillText(phase==='show'?'Watch the sequence…':'Repeat it — tap the nodes', cx0, cy0);
  // progress dots
  for(let i=0;i<seq.length;i++){ cx.fillStyle = i<input.length ? C.ice : 'rgba(125,211,224,.25)';
    cx.beginPath(); cx.arc(cx0-(seq.length*8)/2+i*8, cy0+R+34, 3,0,7); cx.fill(); }
}
function end(){
  playing=false; state='lose'; Engine.startLoop(()=>{});
  cv.removeEventListener('pointerdown',onDown);
  Engine.showEnd({ title:'🐍 The Loop Closes', score:streak, sub:`reached round ${round}`, lesson:G.lesson, deity:G.deity, shareCard:null });
}
G.mount();
</script>
</body></html>
