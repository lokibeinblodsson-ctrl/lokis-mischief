<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sleipnir — Eight-Legged Sprint | Loki's Mischief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games/engine.css">
<style>#game{position:fixed;inset:0;z-index:1}</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Distance <b id="dist">0</b>m</span><span>Coins <b id="coins">0</b></span><span>Lanes <b id="lanes">1</b></span></div>
<div id="game"></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'sleipnir', deity:'sleipnir',
  lesson:'Speed multiplies when you run parallel. Sleipnir\'s relay runs 8 tools at once without crashing.',
  mount(){ buildIntro(); }, onResize(){} };
Engine._game=G;

let cv,cx,lane=1,lanes=4,obstacles=[],coins=[],speed=6,dist=0,coin=0,split=0,mult=1,lastT=0;

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>🐎 Sleipnir — Eight-Legged Sprint</h1>
    <p>Endless runner through Yggdrasil's roots. <b>← / → or swipe</b> to switch lanes. Grab <b>SPLIT runes</b> to ride 2 lanes at once (then 4) — parallel smashes through root walls. Coins multiply when you run parallel.</p>
    <p style="color:var(--muted);font-size:12px">Speed +2% every 10s. Crash into a wall without a split = end.</p>
    <div class="lesson">✦ Models cross-system relay / parallel execution.</div>
    <div class="row"><button class="btn" id="startBtn">Gallop →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.className='game';
  cv.width=innerWidth; cv.height=innerHeight; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.setState('playing'); Engine.startLoop(frame);
  lane=1; obstacles=[]; coins=[]; speed=6; dist=0; coin=0; split=0; mult=1; lastT=performance.now();
  addEventListener('keydown',onKey); cv.addEventListener('pointerdown',onSwipe); cv.addEventListener('pointerup',onSwipeU);
}
function onKey(e){ if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); }
let sx=0;
function onSwipe(e){ sx=e.clientX; }
function onSwipeU(e){ if(sx===0)return; const dx=e.clientX-sx; if(dx<-30)move(-1); else if(dx>30)move(1); sx=0; }
function move(d){ lane=Math.max(0,Math.min(lanes-1,lane+d)); document.getElementById('lanes').textContent=(split>0?(split>0.15?'1-4':'1-2'):'1'); }
function spawn(){
  if(Math.random()<0.5) obstacles.push({lane:Math.floor(Math.random()*lanes),y:-60,kind:'wall'});
  if(Math.random()<0.4) coins.push({lane:Math.floor(Math.random()*lanes),y:-60,split:Math.random()<0.22});
}
function frame(dt){
  const w=cv.width,h=cv.height,lw=w/lanes; dist+=speed*dt*10; speed*=1+0.0003;
  // spawn
  if(Math.random()<dt*1.4) spawn();
  // draw lanes
  cx.clearRect(0,0,w,h);
  for(let i=0;i<lanes;i++){ cx.strokeStyle='#1e2e45'; cx.lineWidth=1; cx.beginPath(); cx.moveTo((i+1)*lw,0); cx.lineTo((i+1)*lw,h); cx.stroke(); }
  // aurora top
  const g=cx.createLinearGradient(0,0,0,h*0.3); g.addColorStop(0,'rgba(125,211,224,0.12)'); g.addColorStop(1,'transparent');
  cx.fillStyle=g; cx.fillRect(0,0,w,h*0.3);
  // sleipnir (active lane(s))
  const drawHorse=(ln,alpha)=>{ const x=(ln+0.5)*lw; cx.globalAlpha=alpha;
    cx.fillStyle='#d4b778'; cx.beginPath(); cx.ellipse(x,h*0.78,lw*0.18,h*0.10,0,0,7); cx.fill();
    cx.fillStyle='#b8954f'; cx.fillRect(x-6,h*0.72,12,28);
    if(split>0){ cx.strokeStyle='rgba(125,211,224,0.6)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(x,h*0.72); cx.lineTo(x,h*0.5); cx.stroke(); }
    cx.globalAlpha=1; };
  if(split>0){ const extra=split>0.15?3:1; for(let k=0;k<=extra;k++) drawHorse((lane+k)%lanes,0.85); }
  else drawHorse(lane,1);
  // obstacles + coins
  const my=(split>0)?[lane,(lane+(split>0.15?3:1))%lanes]:[lane];
  for(const o of obstacles){ o.y+=speed*dt*60;
    cx.fillStyle='#3a2a1a'; cx.fillRect(o.lane*lw+8,o.y,lw-16,40);
    if(o.y>h*0.7 && o.y<h*0.86 && my.includes(o.lane)){ if(split<=0){ return end(); } }
  }
  obstacles=obstacles.filter(o=>o.y<h+60);
  for(const c of coins){ c.y+=speed*dt*60;
    cx.fillStyle=c.split?'#d4b778':'#7dd3e0'; cx.beginPath(); cx.arc((c.lane+0.5)*lw,c.y,12,0,7); cx.fill();
    if(c.y>h*0.7 && c.y<h*0.86 && my.includes(c.lane)){
      coin+=(c.split?5:1)*(split>0?2:1); if(c.split){ split=2.2; } c.got=true;
    }
  }
  coins=coins.filter(c=>!c.got && c.y<h+60);
  if(split>0) split-=dt;
  document.getElementById('dist').textContent=Math.floor(dist);
  document.getElementById('coins').textContent=coin;
  Engine.blip(880,.03,'square',.04);
}
function end(){
  removeEventListener('keydown',onKey);
  cv.removeEventListener('pointerdown',onSwipe); cv.removeEventListener('pointerup',onSwipeU);
  Engine.startLoop(()=>{});
  Engine.showEnd({ title:'🐎 Eight Legs, No Crash', score:Math.floor(dist), sub:`${coin} coins`, lesson:G.lesson, deity:G.deity, shareCard:null });
}
G.mount();
</script>
</body></html>
