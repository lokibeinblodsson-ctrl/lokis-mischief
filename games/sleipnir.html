<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sleipnir — Eight-Legged Sprint | Loki's Mischief</title>
  <meta name="description" content="Sleipnir — Eight-Legged Sprint | Loki's Mischief — parallel execution made playable. Switch lanes, grab split runes, ride 2 then 4 lanes at once.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games/engine.css">
<style>
  #game{position:fixed;inset:0;z-index:1}
  /* owner spec: huge on-screen lane buttons, 68px, plus tap-zones on the canvas halves */
  #ctl{position:fixed;left:0;right:0;bottom:18px;z-index:6;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
  #ctl button{pointer-events:auto;min-width:68px;min-height:68px;font-size:26px;border-radius:16px;
    background:rgba(17,26,38,.85);border:1px solid var(--border);color:var(--ice)}
  #lanes-dots{position:fixed;left:0;right:0;bottom:96px;z-index:6;display:flex;justify-content:center;gap:14px}
  #lanes-dots .dot{width:14px;height:14px;border-radius:50%;background:rgba(125,211,224,.25);border:1px solid var(--border)}
  #lanes-dots .dot.on{width:40px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  canvas.tapzone{position:fixed;top:0;bottom:120px;width:40%;z-index:5}
  #tz-l{left:0}#tz-r{right:0}
</style>

  <link rel="stylesheet" href="../mobile.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Lane <b id="lane">1</b>/4</span><span>Dist <b id="dist">0</b>m</span><span>Coins <b id="coins">0</b></span><span id="state">GALLOPING</span></div>
<div id="lanes-dots"></div>
<div id="game"></div>
<canvas id="tz-l" class="tapzone"></canvas>
<canvas id="tz-r" class="tapzone"></canvas>
<div id="ctl"><button id="bl">◀</button><button id="br">▶</button></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'sleipnir', deity:'sleipnir',
  lesson:'Speed multiplies when you run parallel. Sleipnir\'s relay runs 8 tools at once — your CRM, accounting, project, and email in one ride.',
  mount(){ buildIntro(); }, onResize(w,h){ if(cv){ cv.width=w; cv.height=h; } } };
Engine._game=G;

const C=Engine.C;
let cv,cx,lanes=4,lane=0,targetLane=0,horseX=0,obstacles=[],coins=[],speed=6,dist=0,coin=0,split=0,mult=1,gallop=0;
// owner spec: active-lane glow + bottom dots + top-bar LANE/SPEED, 8 animated legs.
function laneToX(ln){ return (ln+0.5)*(cv.width/lanes); }

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>🐎 Sleipnir — Eight-Legged Sprint</h1>
    <p>Endless relay up Yggdrasil's trunk. <b>◀ / ▶ or swipe</b> (or tap the left/right 40%) to switch lane. Grab <b>SPLIT runes</b> to ride 2 lanes, then 4 — parallel smashes through root walls. Coins multiply when you run parallel.</p>
    <p style="color:var(--muted);font-size:12px">Speed +2% every 10s. Hit a wall without a split = the relay breaks. 56px+ touch targets, pause on tab-out.</p>
    <div class="lesson">✦ Models cross-system relay & parallel execution — your Bifröst Blueprint service.</div>
    <div class="row"><button class="btn" id="startBtn">Gallop →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.className='game';
  cv.width=innerWidth; cv.height=innerHeight; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.fitCanvas(cv);
  // bottom lane dots
  const dots=document.getElementById('lanes-dots'); dots.innerHTML='';
  for(let i=0;i<lanes;i++){ const d=document.createElement('div'); d.className='dot'; d.dataset.i=i; dots.appendChild(d); }
  lane=0; targetLane=0; horseX=laneToX(0); obstacles=[]; coins=[]; speed=6; dist=0; coin=0; split=0; mult=1; gallop=0;
  Engine.setState('playing'); Engine.startLoop(frame);
  addEventListener('keydown',onKey);
  cv.addEventListener('pointerdown',onSwipe); cv.addEventListener('pointerup',onSwipeU);
  document.getElementById('bl').onclick=()=>move(-1);
  document.getElementById('br').onclick=()=>move(1);
  // owner spec: left 40% / right 40% canvas tap zones
  const tl=document.getElementById('tz-l'), tr=document.getElementById('tz-r');
  [tl,tr].forEach(z=>{ z.width=innerWidth*0.4; z.height=innerHeight; });
  tl.onclick=()=>move(-1); tr.onclick=()=>move(1);
  G._cleanup=()=>{ removeEventListener('keydown',onKey); cv.removeEventListener('pointerdown',onSwipe);
    cv.removeEventListener('pointerup',onSwipeU); tl.onclick=null; tr.onclick=null;
    document.getElementById('bl').onclick=null; document.getElementById('br').onclick=null; };
  document.getElementById('state').textContent='GALLOPING';
  document.getElementById('lane').textContent=1;
}
function onKey(e){ if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); }
let sx=0;
function onSwipe(e){ sx=e.clientX; }
function onSwipeU(e){ if(sx===0)return; const dx=e.clientX-sx; if(dx<-40)move(-1); else if(dx>40)move(1); sx=0; }
function move(d){ targetLane=Math.max(0,Math.min(lanes-1,targetLane+d)); lane=targetLane; }

function spawn(){
  if(Math.random()<0.5) obstacles.push({lane:Math.floor(Math.random()*lanes),y:-60,kind:'wall'});
  if(Math.random()<0.4) coins.push({lane:Math.floor(Math.random()*lanes),y:-60,split:Math.random()<0.22});
}
function drawHorse(x,y){
  const W=56,H=36;
  // shadow ellipse
  cx.fillStyle='rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse(x,y+H*0.55,W*0.5,H*0.18,0,0,7); cx.fill();
  // body
  cx.save(); cx.translate(x,y); cx.lineWidth=2; cx.strokeStyle='#ffffff';
  cx.fillStyle='#d4b778'; cx.beginPath(); cx.ellipse(0,0,W*0.5,H*0.4,0,0,7); cx.fill(); cx.stroke();
  // gold mane
  cx.fillStyle='#f0d998'; cx.beginPath(); cx.moveTo(-W*0.4,-H*0.2); cx.lineTo(-W*0.5,-H*0.5); cx.lineTo(-W*0.2,-H*0.25); cx.closePath(); cx.fill();
  // glowing blue eye
  cx.fillStyle='#7dd3e0'; cx.shadowColor='#7dd3e0'; cx.shadowBlur=8; cx.beginPath(); cx.arc(W*0.3,-H*0.05,3,0,7); cx.fill(); cx.shadowBlur=0;
  // 8 legs as dots, animated with sin(gallop + i*0.9)
  for(let i=0;i<8;i++){ const lx=-W*0.35+ (i%4)*(W*0.22); const ly=(i<4?H*0.35:H*0.42)+Math.sin(gallop+i*0.9)*4;
    cx.fillStyle='#b8954f'; cx.beginPath(); cx.arc(lx,ly,2.4,0,7); cx.fill(); }
  cx.restore();
}
function frame(dt){
  if(Engine.state!=='playing') return;
  const w=cv.width,h=cv.height,lw=w/lanes;
  dist+=speed*dt*10; speed*=1+0.0003; gallop+=dt*12;
  if(Math.random()<dt*1.4) spawn();
  // smooth 120ms lane slide (owner spec) — horseX eases toward the targeted lane, lane already set
  const k = Math.min(1, dt/0.12);
  horseX += (laneToX(targetLane)-horseX)*k;
  lane = (Math.abs(horseX-laneToX(targetLane))<lw*0.1)?targetLane:lane;
  cx.clearRect(0,0,w,h);
  // lanes; active lane glows gold 10% + gold border
  for(let i=0;i<lanes;i++){
    const x=i*lw;
    if(i===targetLane){ cx.fillStyle='rgba(212,183,120,.10)'; cx.fillRect(x,0,lw,h); cx.strokeStyle=C.gold; cx.lineWidth=2; cx.strokeRect(x+1,0,lw-2,h); }
    else { cx.strokeStyle='#1e2e45'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(x+lw,0); cx.lineTo(x+lw,h); cx.stroke(); }
  }
  const g=cx.createLinearGradient(0,0,0,h*0.3); g.addColorStop(0,'rgba(125,211,224,0.12)'); g.addColorStop(1,'transparent');
  cx.fillStyle=g; cx.fillRect(0,0,w,h*0.3);
  // horse(s) — split shows extra lanes
  const drawAt=(ln,alpha)=>{ cx.globalAlpha=alpha; drawHorse(laneToX(ln),h*0.78); cx.globalAlpha=1; };
  if(split>0){ const extra=split>0.15?3:1; drawAt(lane,1); drawAt((lane+extra)%lanes,0.85); }
  else drawAt(lane,1);
  const my=(split>0)?[lane,(lane+(split>0.15?3:1))%lanes]:[lane];
  for(const o of obstacles){ o.y+=speed*dt*60;
    cx.fillStyle='#3a2a1a'; cx.fillRect(o.lane*lw+8,o.y,lw-16,40);
    if(o.y>h*0.7 && o.y<h*0.86 && my.includes(o.lane)){ if(split<=0){ return end(); } }
  }
  obstacles=obstacles.filter(o=>o.y<h+60);
  for(const c of coins){ c.y+=speed*dt*60;
    cx.fillStyle=c.split?C.gold:C.ice; cx.beginPath(); cx.arc((c.lane+0.5)*lw,c.y,12,0,7); cx.fill();
    if(c.y>h*0.7 && c.y<h*0.86 && my.includes(c.lane)){
      coin+=(c.split?5:1)*(split>0?2:1); if(c.split){ split=2.2; } c.got=true; }
  }
  coins=coins.filter(c=>!c.got && c.y<h+60);
  if(split>0) split-=dt;
  document.getElementById('dist').textContent=Math.floor(dist);
  document.getElementById('coins').textContent=coin;
  document.getElementById('lane').textContent=(split>0?(split>0.15?'1-4':'1-2'):(lane+1));
  document.getElementById('state').textContent=(speed>11?'DASHING':'GALLOPING')+' • '+speed.toFixed(1)+'x';
  // bottom dots
  document.querySelectorAll('#lanes-dots .dot').forEach((d,i)=>d.classList.toggle('on', i===lane || (split>0 && i===((lane+(split>0.15?3:1))%lanes))));
  Engine.blip(880,.03,'square',.04);
}
function end(){
  if(G._cleanup)G._cleanup();
  Engine.startLoop(()=>{});
  // score rewards distance + parallel coins (mult when split active)
  const score=Math.floor(dist)+coin*2;
  Engine.showEnd({ won:true, title:'🐎 Eight Legs, No Crash', score,
    sub:`${Math.floor(dist)}m · ${coin} coins`, lesson:G.lesson, deity:G.deity,
    meta:{dist:Math.floor(dist),coins:coin} });
}
G.mount();
</script>
</body></html>
