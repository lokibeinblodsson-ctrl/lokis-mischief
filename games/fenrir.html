<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fenrir — Chain Strike | Loki's Mischief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../games/engine.css">
<style>#game{position:fixed;inset:0;z-index:1}</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Chain <b id="chain">Laeding</b></span><span>Hits <b id="hits">0</b>/3</span><span>Score <b id="score">0</b></span></div>
<div id="game"></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'fenrir', deity:'fenrir',
  lesson:'You held chaos with a quiet guard-rail. Fenrir\'s workflow: approval gates + kill-switches that hold where heavy chains get circumvented.',
  mount(){ buildIntro(); }, onResize(w,h){ if(cv){ cv.width=w; cv.height=h; } } };
Engine._game=G;

const CHAINS=[ {name:'Laeding',green:0.40,spd:1.0,dmg:40},{name:'Dromi',green:0.20,spd:1.3,dmg:20},{name:'Gleipnir',green:0.12,spd:1.6,dmg:12} ];
let cv,cx,chainIdx=0,pend=0,dir=1,hp=100,hits=0,score=0,greenPhase=0,swing=0,shake=0;

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>🐺 Fenrir — Chain Strike</h1>
    <p>A pendulum swings over Fenrir. <b>Tap / click / Space</b> when its head is inside the green sweet spot to crack the chain. Three perfect hits break each of the three chains.</p>
    <p style="color:var(--muted);font-size:12px">Laeding (easy) → Dromi (faster) → Gleipnir (narrow + drifts). Miss = chain reforms + screen shake.</p>
    <div class="lesson">✦ Models compliance guard-rails — quiet limits that actually hold.</div>
    <div class="row"><button class="btn" id="startBtn">Strike →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.id='gc';
  cv.width=innerWidth; cv.height=innerHeight; cv.className='game'; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.fitCanvas(cv);
  Engine.setState('playing'); Engine.startLoop(frame);
  chainIdx=0; pend=0; dir=1; hp=100; hits=0; score=0; shake=0;
  document.getElementById('chain').textContent=CHAINS[0].name;
  addEventListener('pointerdown',onTap); addEventListener('keydown',onKey);
  G._cleanup=()=>{removeEventListener('pointerdown',onTap);removeEventListener('keydown',onKey);};
}
function onKey(e){ if(e.code==='Space'){e.preventDefault();onTap();} }
function onTap(){
  if(Engine.state!=='playing') return;
  const c=CHAINS[chainIdx];
  const inGreen = Math.abs(pend)<(c.green/2);
  if(inGreen){ hp-=c.dmg; hits++; score+=100+(c.green<0.3?50:0);
    Engine.blip(720,.07,'sine',.2); burst(); }
  else { hp=Math.min(100,hp+c.dmg*0.25); shake=4; Engine.blip(150,.12,'sawtooth',.18); hits=Math.max(0,hits-0); }
  document.getElementById('hits').textContent=hits; document.getElementById('score').textContent=score;
  if(hp<=0){ hp=100; hits=0; chainIdx++; document.getElementById('chain').textContent=CHAINS[chainIdx].name;
    Engine.blip(90,.3,'sine',.22); if(chainIdx>=3){ end(); } }
}
let parts=[];
function burst(){ const w=cv.width/2,h=cv.height*0.42; for(let i=0;i<14;i++) parts.push({x:w,y:h,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,a:1}); }
function frame(dt){
  const c=CHAINS[chainIdx];
  pend += dir*c.spd*dt*(CHAINS[chainIdx].name==='Gleipnir'?1:1);
  if(chainIdx===2) pend += Math.sin(performance.now()/600)*0.4*dt; // Gleipnir drifts
  if(pend>1){pend=1;dir=-1} if(pend<-1){pend=-1;dir=1}
  const w=cv.width,h=cv.height; cx.clearRect(0,0,w,h);
  cx.save(); if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85;}
  // chain bar
  const bw=Math.min(620,w*0.8), bx=(w-bw)/2, by=h*0.42, bh=26;
  cx.fillStyle='#111a26'; cx.strokeStyle='#1e2e45'; cx.lineWidth=2; roundRect(bx,by,bw,bh,bh/2); cx.fill(); cx.stroke();
  // green sweet spot
  const gw=bw*c.green, gx=bx+(bw-gw)/2;
  cx.fillStyle='rgba(125,211,224,0.25)'; roundRect(gx,by,gw,bh,bh/2); cx.fill();
  cx.fillStyle='#7dd3e0'; roundRect(gx,by,gw,bh/2,bh/2); cx.fill();
  // pendulum head
  const px=bx+((pend+1)/2)*bw;
  cx.fillStyle='#d4b778'; cx.beginPath(); cx.arc(px,by+bh/2,16,0,7); cx.fill();
  // chain hp
  cx.fillStyle='#d4b778'; cx.font='13px Inter'; cx.textAlign='center';
  cx.fillText(CHAINS[chainIdx].name+'  —  '+Math.max(0,Math.round(hp))+'% chain left', w/2, by-14);
  // wolf label
  cx.fillStyle='#64748b'; cx.font='600 15px Cinzel'; cx.fillText('🐺 FENRIR', w/2, by+bh+40);
  // particles
  for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.a-=dt*2; cx.globalAlpha=Math.max(0,p.a);cx.fillStyle='#7dd3e0'; cx.fillRect(p.x,p.y,3,3);} cx.globalAlpha=1;
  parts=parts.filter(p=>p.a>0);
  cx.restore();
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function end(){ if(G._cleanup)G._cleanup(); Engine.setState('lose');
  Engine.showEnd({ title:'🐺 Freed', score, sub:`best chain time saved`, lesson:G.lesson, deity:G.deity, shareCard:null }); }
G.mount();
</script>
</body></html>
