<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fenrir — Chain Strike | Loki's Mischief</title>
  <meta name="description" content="Fenrir — Chain Strike | Loki's Mischief — part of Loki's Mischief: Norse mythology lore, games, and guides.">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../games/engine.css">
<style>#game{position:fixed;inset:0;z-index:1}</style>

  <link rel="stylesheet" href="../mobile.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="topbar"><a href="../index.html" class="brand">✦ LOKI'S MISCHIEF</a>
  <div><a href="../directory.html">Directory</a><a href="../services.html">Services</a><a href="../lore.html">Lore</a></div></div>
<div class="hud"><span>Chain <b id="chain">Laeding</b></span><span>Hits <b id="hits">0</b>/3</span><span>Time <b id="time">90</b>s</span><span>Score <b id="score">0</b></span></div>
<div id="game"></div>
<div id="stage"></div>
<script src="../games/engine.js"></script>
<script>
const G={ id:'fenrir', deity:'fenrir',
  lesson:'You held chaos with a quiet guard-rail. Fenrir\'s workflow: approval gates + kill-switches that hold where heavy chains get circumvented.',
  mount(){ buildIntro(); }, onResize(w,h){ if(cv){ cv.width=w; cv.height=h; } } };
Engine._game=G;

// Design-bible spec: sweet-spot width + pendulum speed per chain; every clean hit removes a third
// of chain integrity, so exactly 3 hits break a chain. Miss reforms it by 10%.
const CHAINS=[ {name:'Laeding',green:0.40,spd:1.0},{name:'Dromi',green:0.20,spd:1.4},{name:'Gleipnir',green:0.12,spd:1.8} ];
const HIT_DMG=100/3, MISS_REFORM=10, TIME_LIMIT=90;
const C=Engine.C;
let cv,cx,chainIdx=0,pend=0,dir=1,hp=100,hits=0,score=0,shake=0;
let timeLeft=TIME_LIMIT, perfects=0, misses=0;

function buildIntro(){
  document.getElementById('stage').innerHTML=`<div class="panel">
    <h1>🐺 Fenrir — Chain Strike</h1>
    <p>A pendulum swings over Fenrir. <b>Tap / click / Space</b> when its head is inside the green sweet spot to crack the chain. Three perfect hits break each of the three chains.</p>
    <p style="color:var(--muted);font-size:12px">Læding 40% window (1.0×) → Dromi 20% (1.4×) → Gleipnir 12% + drifts (1.8×). Hit the centre of the window for a perfect (+50). Miss = chain reforms +10%. 90 seconds for all three.</p>
    <p style="color:var(--muted);font-size:12px">Keys: <b>Space</b> strike · <b>P</b>/<b>Esc</b> pause · <b>M</b> sound</p>
    <div class="lesson">✦ Models compliance guard-rails — quiet limits that actually hold.</div>
    <div class="row"><button class="btn" id="startBtn">Strike →</button></div></div>`;
  document.getElementById('startBtn').onclick=start;
}
function start(){
  document.getElementById('stage').innerHTML=''; cv=document.createElement('canvas'); cv.id='gc';
  cv.width=innerWidth; cv.height=innerHeight; cv.className='game'; document.getElementById('game').appendChild(cv); cx=cv.getContext('2d');
  Engine.fitCanvas(cv);
  Engine.setState('playing'); Engine.startLoop(frame);
  chainIdx=0; pend=0; dir=1; hp=100; hits=0; score=0; shake=0;
  timeLeft=TIME_LIMIT; perfects=0; misses=0;
  document.getElementById('chain').textContent=CHAINS[0].name;
  addEventListener('pointerdown',onTap); addEventListener('keydown',onKey);
  G._cleanup=()=>{removeEventListener('pointerdown',onTap);removeEventListener('keydown',onKey);};
}
function onKey(e){ if(e.code==='Space'){e.preventDefault();onTap();} }
function onTap(){
  if(Engine.state!=='playing') return;
  const c=CHAINS[chainIdx];
  const half=c.green/2;
  const off=Math.abs(pend);
  const inGreen = off < half;
  if(inGreen){
    // "perfect" = inside the central 40% of the green window (bible scoring)
    const perfect = off < half*0.4;
    hp -= HIT_DMG; hits++;
    score += 100 + (perfect?50:0);
    if(perfect) perfects++;
    Engine.blip(perfect?880:720,.07,'sine',.2); burst(perfect);
  } else {
    // miss: chain reforms 10% and the cave shakes — never a hard fail, just lost time
    hp=Math.min(100,hp+MISS_REFORM); shake=6; misses++;
    Engine.blip(150,.12,'sawtooth',.18);
  }
  document.getElementById('hits').textContent=hits; document.getElementById('score').textContent=score;
  if(hp<=0.5){
    hp=100; hits=0; chainIdx++;
    Engine.blip(90,.3,'sine',.22);
    if(chainIdx>=CHAINS.length){ end(true); }
    else document.getElementById('chain').textContent=CHAINS[chainIdx].name;
  }
}
let parts=[];
function burst(perfect){ const w=cv.width/2,h=cv.height*0.42; const n=Engine.REDUCED?4:(perfect?22:14);
  for(let i=0;i<n;i++) parts.push({x:w,y:h,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,a:1,g:perfect}); }
function frame(dt){
  // countdown: the bible gives a 90s budget for all three chains; expiry = fail
  timeLeft -= dt;
  if(timeLeft<=0){ timeLeft=0; end(false); return; }
  const c=CHAINS[chainIdx];
  pend += dir*c.spd*dt;
  // Gleipnir drifts sinusoidally — the "invisible, light, unbreakable" chain never sits still
  if(chainIdx===2) pend += Math.sin(performance.now()/600)*0.36*dt;
  if(pend>1){pend=1;dir=-1} if(pend<-1){pend=-1;dir=1}
  // HUD timer turns ice-blue -> red under 15s so urgency reads without colour alone (numeric too)
  const te=document.getElementById('time');
  if(te){ te.textContent=Math.ceil(timeLeft); te.style.color = timeLeft<15 ? '#ff6b5e' : ''; }
  const w=cv.width,h=cv.height; const t=performance.now()/1000;
  cx.clearRect(0,0,w,h);
  cx.save(); if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85;}
  drawCave(w,h,t);
  drawWolf(w,h*0.62, 1+Math.sin(t*2)*0.02, c);
  // three chain status pips top-center
  const pipY=h*0.16, pw=18, gap=34, x0=w/2-(CHAINS.length-1)*gap/2;
  for(let i=0;i<CHAINS.length;i++){
    cx.fillStyle = i<chainIdx ? '#33405a' : (i===chainIdx ? C.gold : 'rgba(255,255,255,.18)');
    cx.beginPath(); cx.arc(x0+i*gap, pipY, i===chainIdx?9:6,0,7); cx.fill();
    cx.fillStyle='#cbd5e1'; cx.font='600 11px Cinzel'; cx.textAlign='center';
    cx.fillText(CHAINS[i].name, x0+i*gap, pipY+22);
  }
  // tension meter (the chain Fenrir strains against)
  const bw=Math.min(620,w*0.82), bx=(w-bw)/2, by=h*0.40, bh=30;
  cx.fillStyle='#0c1420'; cx.strokeStyle='#1e2e45'; cx.lineWidth=2; roundRect(bx,by,bw,bh,bh/2); cx.fill(); cx.stroke();
  const gw=bw*c.green, gx=bx+(bw-gw)/2;
  const grad=cx.createLinearGradient(gx,0,gx+gw,0); grad.addColorStop(0,'rgba(125,211,224,.18)'); grad.addColorStop(.5,'rgba(125,211,224,.45)'); grad.addColorStop(1,'rgba(125,211,224,.18)');
  cx.fillStyle=grad; roundRect(gx,by,gw,bh,bh/2); cx.fill();
  cx.fillStyle='#7dd3e0'; roundRect(gx,by,gw,bh/2,bh/2); cx.fill();
  // swinging strike orb
  const px=bx+((pend+1)/2)*bw;
  const inGreen = Math.abs(pend)<(c.green/2);
  cx.shadowColor = inGreen?'#7dd3e0':'#d4b778'; cx.shadowBlur=18;
  cx.fillStyle = inGreen?'#7dd3e0':'#d4b778'; cx.beginPath(); cx.arc(px,by+bh/2,15,0,7); cx.fill();
  cx.shadowBlur=0;
  // chain hp readout
  cx.fillStyle=C.gold; cx.font='600 13px Inter'; cx.textAlign='center';
  cx.fillText(CHAINS[chainIdx].name+'  —  '+Math.max(0,Math.round(hp))+'% chain integrity', w/2, by-14);
  // particles
  for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.vy+=0.3*dt*10;p.a-=dt*2; cx.globalAlpha=Math.max(0,p.a);cx.fillStyle=p.g?'#f0d998':'#7dd3e0'; cx.fillRect(p.x,p.y,3,3);} cx.globalAlpha=1;
  parts=parts.filter(p=>p.a>0);
  cx.restore();
}
function drawCave(w,h,t){
  const g=cx.createRadialGradient(w/2,h*0.5,40,w/2,h*0.5,Math.max(w,h)*0.7);
  g.addColorStop(0,'#0e1622'); g.addColorStop(1,'#05080d');
  cx.fillStyle=g; cx.fillRect(0,0,w,h);
  // stalactites
  cx.fillStyle='#0a1119';
  for(let i=0;i<10;i++){ const x=(i+0.5)*w/10; const len=40+((i*53)%60); cx.beginPath(); cx.moveTo(x-10,0); cx.lineTo(x+10,0); cx.lineTo(x,len); cx.closePath(); cx.fill(); }
  // floor glow
  cx.fillStyle='rgba(125,211,224,.05)'; cx.beginPath(); cx.ellipse(w/2,h,Math.min(w*0.5,420),60,0,0,7); cx.fill();
}
function drawWolf(cx0,cy0,s,c){
  cx.save(); cx.translate(cx0,cy0); cx.scale(s,s);
  // shoulders
  cx.fillStyle='#1b2636'; cx.beginPath(); cx.ellipse(0,60,120,70,0,0,7); cx.fill();
  // head
  cx.fillStyle='#243349'; cx.beginPath(); cx.ellipse(0,-10,86,74,0,0,7); cx.fill();
  // ears
  cx.beginPath(); cx.moveTo(-70,-60); cx.lineTo(-44,-110); cx.lineTo(-26,-66); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(70,-60); cx.lineTo(44,-110); cx.lineTo(26,-66); cx.closePath(); cx.fill();
  // snout
  cx.fillStyle='#1b2838'; cx.beginPath(); cx.ellipse(0,28,42,34,0,0,7); cx.fill();
  cx.fillStyle='#0c1420'; cx.beginPath(); cx.ellipse(0,40,16,10,0,0,7); cx.fill();
  // eyes (glow red, brighter as chain weakens)
  const inten = 0.5 + (1-hp/100)*0.5;
  const eg = 6+inten*6;
  for(const sx of [-34,34]){
    cx.shadowColor='#ff3b30'; cx.shadowBlur=18*inten;
    cx.fillStyle=`rgba(255,${60-inten*40},${50-inten*40},1)`;
    cx.beginPath(); cx.ellipse(sx,-14,eg,eg*0.7,0,0,7); cx.fill();
  }
  cx.shadowBlur=0;
  // chain across the muzzle (the binding)
  cx.strokeStyle = chainIdx>=2 ? '#caa15a' : '#8a94a8'; cx.lineWidth=5;
  cx.beginPath(); cx.moveTo(-120,-4); for(let x=-120;x<=120;x+=20){ cx.lineTo(x, -4 + (Math.floor(x/20)%2?6:-6)); } cx.lineTo(120,-4); cx.stroke();
  cx.restore();
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function end(won){
  if(G._cleanup)G._cleanup();
  // time bonus: 2 points per remaining second (bible); max clean run ~750
  const timeBonus = won ? Math.round(timeLeft*2) : 0;
  const total = score + timeBonus;
  const badge = (won && misses===0 && perfects>=9) ? ' · 🏅 Gleipnir Unbound' : '';
  Engine.showEnd({
    won: !!won,
    title: won ? '🐺 Chains Broken' : '⏳ Fenrir Held',
    score: total,
    sub: (won?`+${timeBonus} time bonus · ${perfects} perfect`:'time expired')+badge,
    lesson: G.lesson, deity: G.deity,
    meta: {perfects, misses, seconds: Math.round(TIME_LIMIT-timeLeft)}
  });
}
G.mount();
</script>
</body></html>
