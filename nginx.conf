# Loki's Mischief nginx vhost — flat static serve.
# Purpose: serve index.html at /, lore.html, rune-cast.html, deity pages, and all lokis-assets/.
# No SPA fallback needed (everything is a real file); unknown paths 404 cleanly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (images, fonts, json) aggressively; HTML fresh.
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|ico|woff2?|json|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: no directory listing, hide dotfiles.
    location ~ /\. {
        deny all;
    }
}
